<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="description"
      content="WDD 131 - Dynamic Web Fundamentals - Mark Nielsen - A webpage example of a product review form.">
    <meta name="author" content="Mark Nielsen">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <fieldset>
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Overall Rating</legend>

                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1">☆</label>

                <input type="radio" id="rating2" name="rating" value="2">
                <label for="rating2">☆☆</label>

                <input type="radio" id="rating3" name="rating" value="3">
                <label for="rating3">☆☆☆</label>

                <input type="radio" id="rating4" name="rating" value="4">
                <label for="rating4">☆☆☆☆</label>

                <input type="radio" id="rating5" name="rating" value="5">
                <label for="rating5">☆☆☆☆☆</label>
            </fieldset>

            <fieldset>
                <label for="install_date">Date of Installation</label>
                <input type="date" id="install_date" name="install_date" required>
            </fieldset>

            <fieldset>
                <legend>Useful Features (Check all that apply)</legend>

                <input type="checkbox" id="feature1" name="features" value="Easy to Use">
                <label for="feature1">Accessible</label>

                <input type="checkbox" id="feature2" name="features" value="Durable">
                <label for="feature2">Durable</label>

                <input type="checkbox" id="feature3" name="features" value="Affordable">
                <label for="feature3">Affordable</label>

                <input type="checkbox" id="feature4" name="features" value="High Performance">
                <label for="feature4">High Quality</label>
            </fieldset>

            <fieldset>
                <label for="review">Written Review</label>
                <textarea id="review" name="review" rows="4" cols="50"></textarea>
            </fieldset>

            <fieldset>
                <label for="username">User Name</label>
                <input type="text" id="username" name="username">
            </fieldset>

            <input type="submit" value="Submit Review">

        </form>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> Mark Nielsen</p>
        <p id="lastmodified"></p>
    </footer>
</body>
</html>
