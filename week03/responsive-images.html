<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="description"
      content="A webpage example of basic responsive images">
    <meta name="author" content="Mark Nielsen">
</head>
<body>
    <main>
        <div class="hero">
            <picture>
                <source media="(min-width: 1000px)" srcset="images/hero-large.webp">
                <source media="(min-width: 500px)" srcset="images/hero-medium.webp">
                <img src="images/hero-small.webp" alt="Indianapolis Temple located in Carmel Indiana" width="1500" height="750">
            </picture>
        </div>
    </main>
</body>
</html>
